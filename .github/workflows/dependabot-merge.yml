name: Merge verified Dependabot updates

on:
  workflow_call:
    inputs:
      update-policy:
        description: stable-dependencies or actions-only
        required: true
        type: string
      min-release-age-days:
        description: Days a release must be public before it can merge. Match the Dependabot cooldown.
        required: false
        type: number
        default: 7
      ci-workflow:
        description: Name of the CI workflow whose latest run on the head must pass. Used when an approval triggers the run.
        required: false
        type: string
        default: CI

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # The reusable workflow keeps the caller's event context. CI finishing and
    # an approval both start a run, and each run checks the current head from
    # scratch, so a merge needs green CI and an approval on that same commit.
    # Nothing is left armed between runs.
    if: >
      github.repository_owner == 'darkroomengineering' && (
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.name != 'ci-gate' &&
          github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event_name == 'pull_request_review' &&
          github.event.review.state == 'approved' &&
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository))
    concurrency:
      group: dependabot-merge-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
    steps:
      - name: Validate update policy
        env:
          UPDATE_POLICY: ${{ inputs.update-policy }}
        run: |
          case "$UPDATE_POLICY" in
            stable-dependencies|actions-only) ;;
            *) echo 'Unsupported update policy.'; exit 1 ;;
          esac

      - name: Resolve Dependabot PR from head SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          matches=$(gh api --paginate --slurp \
            "/repos/$REPO/commits/$HEAD_SHA/pulls?per_page=100" | \
            jq --arg sha "$HEAD_SHA" \
              '[.[][] | select(.state == "open" and .head.sha == $sha)]')
          count=$(echo "$matches" | jq 'length')
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one open PR for sha $HEAD_SHA; found $count."
            echo "Not auto-merging."
            exit 0
          fi

          if ! echo "$matches" | jq -e --arg repo "$REPO" \
            '.[0] | .user.login == "dependabot[bot]" and
              .head.repo.full_name == $repo and .base.repo.full_name == $repo and
              .base.ref == "main" and .draft == false' > /dev/null; then
            echo "PR must be a ready Dependabot PR from this repository to main."
            exit 0
          fi
          echo "number=$(echo "$matches" | jq -r '.[0].number')" >> "$GITHUB_OUTPUT"

      - name: Verify a permitted stable patch or minor update
        id: update_type
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          UPDATE_POLICY: ${{ inputs.update-policy }}
        run: |
          set -o pipefail
          pr_json=$(gh pr view "$PR" --repo "$REPO" --json title,changedFiles,headRefOid)
          if ! printf '%s\n' "$pr_json" | jq -e --arg sha "$HEAD_SHA" \
            '.headRefOid == $sha' > /dev/null; then
            echo "PR head changed; not auto-merging."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$UPDATE_POLICY" = 'actions-only' ]; then
            # GitHub returns at most 3000 PR files. Require a complete,
            # nonempty result, including the previous paths of renamed files.
            if ! printf '%s\n' "$pr_json" | jq -e \
              '.changedFiles > 0 and .changedFiles <= 3000' > /dev/null; then
              echo "Unsupported file count; not auto-merging."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            file_count=$(printf '%s\n' "$pr_json" | jq '.changedFiles')
            if ! gh api --paginate --slurp "/repos/$REPO/pulls/$PR/files?per_page=100" | \
              jq -e --argjson count "$file_count" \
                '[.[][]] as $files | ($files | length) == $count and
                  all($files[]; (.filename | test("^\\.github/workflows/[^/]+\\.ya?ml$")) and
                    ((.previous_filename // .filename) | test("^\\.github/workflows/[^/]+\\.ya?ml$")))' > /dev/null; then
              echo "PR must change only workflow files, with a complete file list; not auto-merging."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          title=$(printf '%s\n' "$pr_json" | jq -r '.title')
          # Unknown titles, grouped bumps, prereleases and 0.x stay manual.
          version='[1-9][0-9]*\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          case "$UPDATE_POLICY" in
            stable-dependencies)
              pattern="^(chore\\(deps(-dev)?\\)|ci): [Bb]ump [@a-zA-Z0-9_./-]+ from $version to $version$"
              ;;
            actions-only)
              pattern="^ci: [Bb]ump [a-zA-Z0-9_-]+/[a-zA-Z0-9_.-]+ from $version to $version$"
              ;;
            *) echo 'Unsupported update policy.'; exit 1 ;;
          esac
          transition=$(printf '%s\n' "$title" | grep -E "$pattern" || true)
          if [ -z "$transition" ] || [ "$transition" != "$title" ]; then
            echo "Title does not prove a stable single-package update; not auto-merging."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          from=$(echo "$transition" | awk '{print $(NF-2)}')
          to=$(echo "$transition" | awk '{print $NF}')
          if jq -en --arg from "$from" --arg to "$to" \
            '($from | split(".") | map(tonumber)) as $a |
              ($to | split(".") | map(tonumber)) as $b |
              $a[0] == $b[0] and $b > $a' > /dev/null; then
            echo "Stable patch/minor bump: $from -> $to. Eligible for auto-merge."
            echo "package=$(echo "$transition" | awk '{print $(NF-4)}')" >> "$GITHUB_OUTPUT"
            echo "version=$to" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "Major, unchanged or downgraded version: $from -> $to. Not auto-merging."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # A malicious release is usually found and removed within days. The
      # Dependabot cooldown keeps young releases from opening a PR; this check
      # holds when a caller has no cooldown. A release whose date cannot be
      # read stays manual.
      - name: Verify release age
        id: age
        if: >
          steps.pr.outputs.number != '' &&
          steps.update_type.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ steps.update_type.outputs.package }}
          VERSION: ${{ steps.update_type.outputs.version }}
          MIN_DAYS: ${{ inputs.min-release-age-days }}
        run: |
          # npm names are `name` or `@scope/name`; Actions are `owner/repo[/path]`.
          # Only a date read from a successful request counts.
          published=
          if [[ "$PACKAGE" == @* || "$PACKAGE" != */* ]]; then
            if body=$(curl -fsS "https://registry.npmjs.org/${PACKAGE/\//%2F}"); then
              published=$(jq -r --arg v "$VERSION" '.time[$v] // empty' <<< "$body")
            fi
          else
            repo=$(cut -d/ -f1-2 <<< "$PACKAGE")
            for tag in "v$VERSION" "$VERSION"; do
              if date=$(gh api "/repos/$repo/releases/tags/$tag" --jq .published_at 2>/dev/null); then
                published=$date
                break
              fi
            done
          fi
          if ! [[ "$published" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]] ||
            ! released=$(date -u -d "$published" +%s); then
            echo "No publish date for $PACKAGE $VERSION; not auto-merging."
            exit 0
          fi
          age=$(( ($(date -u +%s) - released) / 86400 ))
          if (( age < MIN_DAYS )); then
            echo "$PACKAGE $VERSION is $age days old, under $MIN_DAYS; not auto-merging."
            exit 0
          fi
          echo "$PACKAGE $VERSION is $age days old."
          echo "old_enough=true" >> "$GITHUB_OUTPUT"

      - name: Verify latest CI run, approval and squash merge
        if: >
          steps.pr.outputs.number != '' &&
          steps.update_type.outputs.skip == 'false' &&
          steps.age.outputs.old_enough == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -o pipefail
          # A CI-triggered run must be the latest run and attempt on the head.
          # An approval-triggered run looks up the named CI workflow instead.
          exact=true
          if [ "$EVENT" != 'workflow_run' ]; then
            if [ "$CI_WORKFLOW" = 'ci-gate' ]; then
              echo 'ci-gate does not prove an update works; not auto-merging.'
              exit 0
            fi
            ids=$(gh api --paginate --slurp "/repos/$REPO/actions/workflows?per_page=100" | \
              jq --arg name "$CI_WORKFLOW" '[.[].workflows[] | select(.name == $name) | .id]')
            if [ "$(jq 'length' <<< "$ids")" -ne 1 ]; then
              echo "Expected exactly one workflow named $CI_WORKFLOW; not auto-merging."
              exit 0
            fi
            WORKFLOW_ID=$(jq '.[0]' <<< "$ids")
            RUN_ID=0 RUN_ATTEMPT=0 exact=false
          fi
          if ! gh api --paginate --slurp \
            "/repos/$REPO/actions/workflows/$WORKFLOW_ID/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=100" | \
            jq -e --arg sha "$HEAD_SHA" --argjson attempt "$RUN_ATTEMPT" \
              --argjson run "$RUN_ID" --argjson workflow "$WORKFLOW_ID" \
              --argjson exact "$exact" \
              '[.[].workflow_runs[] | select(.workflow_id == $workflow and
                .event == "pull_request" and .head_sha == $sha)] |
                max_by([.created_at, .id]) |
                (if $exact then .id == $run and .run_attempt == $attempt else true end) and
                .status == "completed" and .conclusion == "success"' > /dev/null; then
            echo "CI was superseded, rerun or is not successful; not auto-merging."
            exit 0
          fi

          # The workflow never approves. When the branch rules want a review,
          # a person must have approved this exact commit, so an approval of an
          # earlier head does not carry over to a version this run has not seen.
          decision=$(gh pr view "$PR" --repo "$REPO" --json reviewDecision --jq '.reviewDecision')
          case "$decision" in
            '') ;;
            APPROVED)
              if ! gh api --paginate --slurp "/repos/$REPO/pulls/$PR/reviews?per_page=100" | \
                jq -e --arg sha "$HEAD_SHA" \
                  'any(.[][]; .state == "APPROVED" and .commit_id == $sha and .user.type == "User")' > /dev/null; then
                echo "No approval on $HEAD_SHA yet; waiting for one."
                exit 0
              fi
              ;;
            *)
              echo "Review decision is $decision; waiting for an approval."
              exit 0
              ;;
          esac
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch \
            --match-head-commit "$HEAD_SHA"
